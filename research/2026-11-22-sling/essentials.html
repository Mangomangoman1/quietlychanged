streams at a time. If you subscribe to our Sling Orange service, you can enjoy one stream at a time. Any extras you add to your Sling Orange service will be included in your single stream. If you subscribe to our Sling Blue service, you can enjoy up to three streams of these channels at the same time. Any extras you add to your Sling Blue service&amp;nbsp;will be included in your three streams. If you subscribe to both services in Sling Orange + Sling Blue, you can enjoy up to four streams at the same time. Because you are purchasing two separate services in Sling Orange + Sling Blue, you can get the total number of streams included on each separate service—one stream for any channel on the single-stream Sling Orange service and three streams for channels on the multi-stream Sling Blue service.&amp;nbsp;If you subscribe to our Sling Essentials service, you can enjoy one stream at a time. Any extras you add to your Sling&amp;nbsp;Essentials&amp;nbsp;service will be included in your single stream. If you subscribe to our Sling Select service, you can enjoy up to three streams of these channels at the same time. Any extras you add to your Sling&amp;nbsp;Select&amp;nbsp;service&amp;nbsp;will be included in your three streams. If you subscribe to both services in Sling&amp;nbsp;Essentials&amp;nbsp;+ Sling&amp;nbsp;Select, you can enjoy up to four streams at the same time. Because you are purchasing two separate services in Sling&amp;nbsp;Essentials&amp;nbsp;+ Sling&amp;nbsp;Select, you can get the total number of streams included on each separate service—one stream for any channel on the single-stream Sling&amp;nbsp;Essentials&amp;nbsp;service and three streams for channels on the multi-stream Sling&amp;nbsp;Select&amp;nbsp;service.&lt;/p>\n&lt;p>&lt;b>Miscellaneous&lt;/b>&lt;/p>\n&lt;p>Certain programs may be unavailable due to programmer restrictions or blackouts. Only available within the United States. State and local taxes apply. All prices, fees, charges, services, programming, features, functionality and offers subject to change without notice.&lt;/p>\n&lt;p>&lt;b>Channels Offered in Select Markets&lt;/b>&lt;/p>\n&lt;p>Some local channels including ABC, FOX and NBC are only available in select markets. See which local channels are available in your area&amp;nbsp;&lt;b>&lt;a href=\&#34;/help/en/subscription-programming-questions/channels-programming/local-channels\&#34;>here&lt;/a>&lt;/b>.&lt;/p>\n&#34;,&#34;componentId&#34;:&#34;features-button&#34;,&#34;analyticsModalName&#34;:&#34;features-cta&#34;,&#34;buttonStyle&#34;:&#34;primary&#34;,&#34;cancelModalConfig&#34;:{&#34;primaryButtonStyle&#34;:&#34;primary&#34;,&#34;secondaryButtonStyle&#34;:&#34;skeleton&#34;},&#34;pauseModalConfig&#34;:{&#34;cancelModal&#34;:false,&#34;primaryButtonStyle&#34;:&#34;primary&#34;,&#34;secondaryButtonStyle&#34;:&#34;skeleton&#34;}}"></div></div>

<div class="tabbed-faq--container">
     <div class="js-react js-react-tabbed-faq " data-sling-props="{&#34;tabbedFaqComponentId&#34;:&#34;homepage-faq&#34;,&#34;title&#34;:&#34;Frequently Asked Questions&#34;,&#34;subHeadline&#34;:&#34;&lt;p>We&#39;re here to help! &lt;a title=\&#34;Sling Help Site\&#34; href=\&#34;/help/en\&#34; style=\&#34;color: rgb(0,185,255);\&#34;>&lt;b>Visit our help center&lt;/b>&lt;/a> if you have more questions.&lt;/p>\r\n&#34;,&#34;mode&#34;:&#34;dark&#34;,&#34;faqConfig&#34;:[{&#34;id&#34;:&#34;about&#34;,&#34;title&#34;:&#34;About&#34;,&#34;accordionConfig&#34;:[{&#34;id&#34;:&#34;what-is-sling&#34;,&#34;title&#34;:&#34;What is Sling TV?&#34;,&#34;content&#34;:&#34;&lt;p>Sling is a flexible TV streaming service that connects you to the best live TV without rigid contracts.&lt;br />\r\n&lt;br />\r\nGet monthly access to your favorite channels, add just the extras you’ll watch, and stop paying for all the fluff.&lt;br />\r\n&lt;br />\r\nOn a tight budget? Watch 600+ free channels with &lt;a href=\&#34;/freestream\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Freestream&lt;/span>&lt;/b>&lt;/a>&lt;b>&lt;b>.&lt;/b>&lt;/b>&lt;/p>\r\n&lt;p>&lt;b>&lt;b> &lt;/b>&lt;/b>&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;dvr-with-sling&#34;,&#34;title&#34;:&#34;Can I record programs on Sling?&#34;,&#34;content&#34;:&#34;&lt;p>Subscribers can record live TV and save it to their DVR with 50 hours of free DVR storage, and can extend to unlimited storage by adding Unlimited DVR for just $5/mo.&lt;br />\r\n&lt;br />\r\nSling’s DVR is in the cloud, which means you can watch your recorded content from any logged-in device, wherever you have Wi-Fi.&lt;br />\r\n&lt;br />\r\nLocal Now, Pluto, and any local channels added with an over-the-air antenna can’t be recorded.&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;multiple-devices&#34;,&#34;title&#34;:&#34;Can I watch Sling on multiple devices at the same time?&#34;,&#34;content&#34;:&#34;&lt;p>The amount of devices you can watch Sling on at the same time varies depending on your base plan and which channels you’re watching.&amp;nbsp;&lt;a href=\&#34;/help/en/troubleshooting/device-questions/multiple-screens\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Learn more about streaming on multiple devices&lt;/span>&lt;/b>&lt;/a>.&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;on-demand&#34;,&#34;title&#34;:&#34;Are shows available on demand?&#34;,&#34;content&#34;:&#34;&lt;p>We have an ever-changing list of thousands of TV shows and movies available on demand! &lt;br />\r\n&lt;br />\r\nUse the search bar in your guide to see if your favorites are available.&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;cancel-sling&#34;,&#34;title&#34;:&#34;What if I want to cancel?&#34;,&#34;content&#34;:&#34;&lt;p>Monthly subscribers can cancel anytime by &lt;a href=\&#34;/my-account\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>visiting their account&lt;/span>&lt;/b>&lt;/a>. You’ll continue to have access to Sling until the period you’ve paid for ends and won’t be charged again until you resubscribe.&lt;br />\r\n&lt;br />\r\n&lt;/p>\r\n&lt;p>Sling is proud to have flexible options. Come and go as you please!&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;get-started&#34;,&#34;title&#34;:&#34;How do I get started?&#34;,&#34;content&#34;:&#34;&lt;p>Start watching live sports, news, and entertainment in just a few steps.&lt;/p>\r\n&lt;p>1. &lt;a href=\&#34;/get-started?classification=us&amp;amp;plan=one-month&amp;amp;plan_offer=monthly-web\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Create an account&lt;/span>&lt;/b>&lt;/a>&lt;/p>\r\n&lt;p>2. Choose your channel lineup&lt;/p>\r\n&lt;p>3. Start watching&lt;/p>\r\n&lt;p>&lt;br />\r\nYou can also watch &lt;a href=\&#34;/freestream\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Freestream&lt;/span>&lt;/b>&lt;/a> until you’re ready to decide on the best plan for you! No account needed.&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;what-do-i-need&#34;,&#34;title&#34;:&#34;What do I need to get started with Sling?&#34;,&#34;content&#34;:&#34;&lt;p>You’ll need a reliable internet connection of at least 3 Mbps and a &lt;a href=\&#34;/help/en/troubleshooting/device-questions/supported-devices\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>supported device&lt;/span>&lt;/b>&lt;/a>.&lt;br />\r\n&lt;br />\r\nSling works on streaming devices, smart TVs, mobile phones, computers, tablets, and more!&lt;/p>\r\n&lt;p>&lt;br />\r\nFor a great experience watching on multiple devices, an internet speed of 25 Mbps is recommended. &lt;a href=\&#34;https://www.speedtest.net/\&#34; target=\&#34;_blank\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Check your internet speed&lt;/span>&lt;/b>&lt;/a>.&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;free-trial&#34;,&#34;title&#34;:&#34;Does Sling offer a free trial?&#34;,&#34;content&#34;:&#34;&lt;p>Although there’s no free trial for Sling, anyone can watch limited channels on &lt;a href=\&#34;/freestream\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Freestream&lt;/span>&lt;/b>&lt;/a> at no charge, and access doesn’t end after a few days like a free trial!&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;how-long&#34;,&#34;title&#34;:&#34;How long is a Sling subscription?&#34;,&#34;content&#34;:&#34;&lt;p>Sling is a monthly subscription that you can customize on your schedule. Add content or change plans depending on what you want to watch in a given month.  &lt;br />\r\n &lt;/p>\r\n&lt;p>&lt;a href=\&#34;/service/add-ons\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Explore all of our add-ons&lt;/span>&lt;/b>&lt;/a>&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false}]},{&#34;id&#34;:&#34;whats-on&#34;,&#34;title&#34;:&#34;What’s on Sling?&#34;,&#34;accordionConfig&#34;:[{&#34;id&#34;:&#34;live-news&#34;,&#34;title&#34;:&#34;What live news can I watch on Sling?&#34;,&#34;content&#34;:&#34;&lt;p>Watch CNN and BBC World News with any Sling subscription.&lt;br />\r\n&lt;br />\r\nFor more news, choose &lt;a href=\&#34;/service/sling-blue\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Sling Blue&lt;/span>&lt;/b>&lt;/a>, which includes FOX News and MSNOW.&lt;a href=\&#34;/service\&#34;> &lt;br />\r\n &lt;br />\r\n &lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Explore your plan options&lt;/span>&lt;/b>&lt;/a>.&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;live-sports&#34;,&#34;title&#34;:&#34;What live sports can I watch on Sling?&#34;,&#34;content&#34;:&#34;&lt;p>Watch College NCAA football, NFL, WNBA, and more, live.&lt;br />\r\n&lt;br />\r\nPick the plan that includes the games, matches, and races you live for. Sling has ESPN, FS1, TNT, TBS and more.&lt;br />\r\n&lt;br />\r\n&lt;a href=\&#34;/sports\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Explore sports channels&lt;/span>&lt;/b>&lt;/a>.&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;local-channels&#34;,&#34;title&#34;:&#34;Do I get local channels with Sling?&#34;,&#34;content&#34;:&#34;&lt;p>Sling Blue and Sling Orange &amp;amp; Blue include live streaming of some local channels, but access depends on where you live.&lt;br />\r\n&lt;br />\r\n&lt;/p>\r\n&lt;p>&lt;a href=\&#34;/programming/local-channels\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Check which local channels are included in your area&lt;/span>&lt;/b>&lt;br />\r\n &lt;br />\r\n&lt;/a>&lt;/p>\r\n&lt;p>Local channels are not included with Sling Orange.&lt;/p>\r\n&lt;p>If your area or preferred Sling plan doesn’t include local channels, you may be able to get local channels for free with an over-the-air (OTA) antenna.&lt;/p>\r\n&lt;p> &lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;favorite-show&#34;,&#34;title&#34;:&#34;Can I add my favorite show?&#34;,&#34;content&#34;:&#34;&lt;p>Sling is customizable! Start with a base plan, then build the perfect subscription for you by adding &lt;a href=\&#34;/service/premium-streaming\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Premium plans&lt;/span>&lt;/b>&lt;/a> and mini channel collections, like &lt;a href=\&#34;/programming/reality\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Entertainment Extra&lt;/span>&lt;/b>&lt;/a> or &lt;a href=\&#34;/sports\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>Sports Extra&lt;/span>&lt;/b>&lt;/a>.&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false}]},{&#34;id&#34;:&#34;save&#34;,&#34;title&#34;:&#34;Save on Sling&#34;,&#34;accordionConfig&#34;:[{&#34;id&#34;:&#34;save-money&#34;,&#34;title&#34;:&#34;How do I save money with Sling?&#34;,&#34;content&#34;:&#34;&lt;p>Sling is the most flexible TV streaming service, and also the best TV streaming value on the market.&lt;br />\r\n&lt;br />\r\nFor under $51 you can choose a monthly plan with the channels that matter most to you. &lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false},{&#34;id&#34;:&#34;most-channels&#34;,&#34;title&#34;:&#34;How do I get the most channels?&#34;,&#34;content&#34;:&#34;&lt;p>If you’re switching from a traditional satellite service like DISH, the most similar experience is with Sling’s Total TV deal.&lt;br />\r\n&lt;br />\r\nTotal TV includes:&lt;/p>\r\n&lt;p>&lt;b>· &lt;/b>Kids Extra&lt;/p>\r\n&lt;p>&lt;b>· &lt;/b>Entertainment Extra&lt;/p>\r\n&lt;p>&lt;b>· &lt;/b>News Extra&lt;/p>\r\n&lt;p>&lt;b>· &lt;/b>Lifestyle Extra&lt;/p>\r\n&lt;p>&lt;b>· &lt;/b>Sports Extra&lt;/p>\r\n&lt;p>&lt;b>· &lt;/b>Heartland Extra&lt;/p>\r\n&lt;p>&lt;b>· &lt;/b>Hollywood Extra&lt;/p>\r\n&lt;p>&lt;b>· &lt;/b>Unlimited DVR&lt;/p>\r\n&lt;p>&lt;br />\r\nLearn more about &lt;a href=\&#34;/deals\&#34;>&lt;b>&lt;span style=\&#34;color: rgb(0,185,255);\&#34;>deals on Sling&lt;/span>&lt;/b>&lt;/a>.&lt;/p>\r\n&#34;,&#34;contentExpanded&#34;:false}]}]}">
    </div>
</div>

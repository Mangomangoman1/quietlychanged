eams at a time. If you subscribe to our Sling Orange service, you can enjoy one stream at a time. Any extras you add to your Sling Orange service will be included in your single stream. If you subscribe to our Sling Blue service, you can enjoy up to three streams of these channels at the same time. Any extras you add to your Sling Blue service&amp;nbsp;will be included in your three streams. If you subscribe to both services in Sling Orange + Sling Blue, you can enjoy up to four streams at the same time. Because you are purchasing two separate services in Sling Orange + Sling Blue, you can get the total number of streams included on each separate service—one stream for any channel on the single-stream Sling Orange service and three streams for channels on the multi-stream Sling Blue service.&amp;nbsp;If you subscribe to our Sling Essentials service, you can enjoy one stream at a time. Any extras you add to your Sling&amp;nbsp;Essentials&amp;nbsp;service will be included in your single stream. If you subscribe to our Sling Select service, you can enjoy up to three streams of these channels at the same time. Any extras you add to your Sling&amp;nbsp;Select&amp;nbsp;service&amp;nbsp;will be included in your three streams. If you subscribe to both services in Sling&amp;nbsp;Essentials&amp;nbsp;+ Sling&amp;nbsp;Select, you can enjoy up to four streams at the same time. Because you are purchasing two separate services in Sling&amp;nbsp;Essentials&amp;nbsp;+ Sling&amp;nbsp;Select, you can get the total number of streams included on each separate service—one stream for any channel on the single-stream Sling&amp;nbsp;Essentials&amp;nbsp;service and three streams for channels on the multi-stream Sling&amp;nbsp;Select&amp;nbsp;service.&lt;/p>\n&lt;p>&lt;b>Miscellaneous&lt;/b>&lt;/p>\n&lt;p>Certain programs may be unavailable due to programmer restrictions or blackouts. Only available within the United States. State and local taxes apply. All prices, fees, charges, services, programming, features, functionality and offers subject to change without notice.&lt;/p>\n&lt;p>&lt;b>Channels Offered in Select Markets&lt;/b>&lt;/p>\n&lt;p>Some local channels including ABC, FOX and NBC are only available in select markets. See which local channels are available in your area&amp;nbsp;&lt;b>&lt;a href=\&#34;/help/en/subscription-programming-questions/channels-programming/local-channels\&#34;>here&lt;/a>&lt;/b>.&lt;/p>\n&#34;,&#34;themeName&#34;:&#34;dark&#34;,&#34;minHeightRequired&#34;:false,&#34;ctaType&#34;:&#34;link&#34;}"></div>
